<sbb-accordion>
  @for (motionSensor of motionSensors().values(); track motionSensor.name) {
    <sbb-expansion-panel>
      <sbb-expansion-panel-header>
        <sbb-icon [class.red]="!motionSensor.presence" [class.green]="motionSensor.presence" name="run-medium"/>
        <span class="label">{{ motionSensor.name }}</span>
      </sbb-expansion-panel-header>

      <sbb-expansion-panel-content>
        <app-motion-sensor-form [sensor]="motionSensor"
                                [devices]="devices()"
                                [weather]="currentWeather()"
                                [animations]="animations()"
                                (onSave)="save.emit($event)"/>
      </sbb-expansion-panel-content>
    </sbb-expansion-panel>
  }
</sbb-accordion>
