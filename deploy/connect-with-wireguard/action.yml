name: Connect to wireguard
description: Allow to connect to a wireguard-server.
# Schema: https://json.schemastore.org/github-action.json

inputs:
  client-private-key:
    description: 'Private Client Key'
    required: true
  client-ip:
    description: 'IP for the client'
    required: true
  allowed-ips:
    description: 'Allowed IPs'
    required: true
  server-public-key:
    description: 'Public key of the server'
    required: true
  endpoint:
    description: 'Endpoint of the server'
    required: true


runs:
  using: composite
  steps:
    - run: sudo apt install wireguard
      shell: bash
    - run: umask 0666
      shell: bash
    - run: echo "${{ inputs.client-private-key }}" > /etc/wireguard/private.key
      shell: bash
    - run: sudo ip link add dev wg0 type wireguard
      shell: bash
    - run: sudo ip address add dev wg0 ${{ inputs.client-ip }} peer ${{ inputs.allowed-ips }}
      shell: bash
    - run: sudo wg set wg0 private-key /etc/wireguard/private.key peer ${{ inputs.server-public-key }} allowed-ips ${{ inputs.allowed-ips }} endpoint ${{ inputs.endpoint }}
      shell: bash
    - run: sudo ip link set up dev wg0
      shell: bash

