name: Publish frontend
on:
  push:
    branches: [ feature/* ]
    paths:
      - 'frontend/**'
      - 'deploy/frontend/**'
      - '.github/workflows/publish-frontend-feature.yml'
jobs:
  publish:
    name: Build and Publish Frontend
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner}}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: true
          platforms: ${{ matrix.platform}}
          cache-from: akop/home-system-frontend:unstable
          outputs: type=image,name=akop/home-system-frontend,push-by-digest=true,name-canonical=true,push=true
          tags: unstable

  deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - id: wireguard
        uses: egor-tensin/setup-wireguard@v1
        with:
          endpoint: ${{ secrets.WIREGUARD_ENDPOINT }}
          endpoint_public_key: ${{ secrets.WIREGUARD_SERVER_PUBLIC_KEY }}
          ips: ${{ secrets.WIREGUARD_CLIENT_IP }}
          private_key: ${{ secrets.WIREGUARD_CLIENT_PRIVATE_KEY }}
          allowed_ips: ${{ secrets.WIREGUARD_ALLOWED_IPS }}
      - name: Deploy
        uses: WyriHaximus/github-action-helm3@v3
        with:
          exec: echo '${{ secrets.VALUES_YAML_HOME_SYSTEM_FRONTEND_FEATURE }}' | helm upgrade akops-home-frontend ./deploy/frontend --install --wait --atomic --values -
          kubeconfig: '${{ secrets.K8S_CONF_AKOP_ONLINE }}'
